name: Publish validated AgentSec Inspector v1.4.0 (one time)

on:
  push:
    paths:
      - .github/workflows/publish-v140-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.4.0
      SOURCE_SHA: 566ac79c64ad5f5d68332e5c04e73a4ae4e8fe1f
      WINDOWS_RUN: "41220253001"
      LINUX_RUN: "41220253100"
      FRONTEND_RUN: "41220252963"
      BACKEND_RUN: "41220253012"
      SECURITY_RUN: "41220252983"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact validated code and finished quality checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git cat-file -e "$SOURCE_SHA^{commit}"
          while IFS= read -r changed; do
            case "$changed" in
              README.md|README.en.md|docs/RELEASE_NOTES_1.4.0.md|.github/workflows/publish-v140-once.yml|.github/workflows/prune-stale-ci-once.yml) ;;
              *) echo "Unvalidated application change since $SOURCE_SHA: $changed"; exit 1;;
            esac
          done < <(git diff --name-only "$SOURCE_SHA" HEAD)
          grep -q '"version": "1.4.0"' src-tauri/tauri.conf.json
          grep -q 'version = "1.4.0"' src-tauri/Cargo.toml
          grep -q 'version: str = "1.4.0"' backend/agentsec/config.py
          test -s docs/RELEASE_NOTES_1.4.0.md
          for file in mcp-inventory mcp-tool-form mcp-vulnerability-scan; do
            test -s "docs/images/$file.png"
            grep -q "docs/images/$file.png" README.md
            grep -q "docs/images/$file.png" README.en.md
          done
          grep -q 'releases/download/v1.4.0' README.md
          grep -q 'releases/download/v1.4.0' README.en.md
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Version already published; refusing to modify release"
            exit 1
          fi
          for run in "$WINDOWS_RUN" "$LINUX_RUN" "$FRONTEND_RUN" "$BACKEND_RUN" "$SECURITY_RUN"; do
            response="$(gh run view "$run" --repo "$GH_REPO" --json headSha,status,conclusion)"
            echo "$response" | jq -e --arg sha "$SOURCE_SHA" '
              .headSha == $sha and .status == "completed" and .conclusion == "success"
            ' >/dev/null || { echo "Validation not successful on expected source SHA: $run"; exit 1; }
          done
          echo "All five source-commit validations verified. Changes after source commit are documentation/one-off CI only."

      - name: Download verified Windows and Linux build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/windows release/linux
          gh run download "$WINDOWS_RUN" --repo "$GH_REPO" --name agentsec-windows-x64 --dir release/windows
          gh run download "$LINUX_RUN" --repo "$GH_REPO" --name agentsec-linux-x64 --dir release/linux

      - name: Assemble four packages and integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          msi="$(find release/windows -type f -name '*.msi' -print -quit)"
          exe="$(find release/windows -type f -name '*.exe' -print -quit)"
          appimage="$(find release/linux -type f -name '*.AppImage' -print -quit)"
          deb="$(find release/linux -type f -name '*.deb' -print -quit)"
          for package in "$msi" "$exe" "$appimage" "$deb"; do
            test -n "$package"
            test -s "$package"
            test "$(stat -c%s "$package")" -gt 1048576
          done
          mkdir -p release/assets
          cp "$msi" release/assets/AgentSec-Inspector_1.4.0_x64_en-US.msi
          cp "$exe" release/assets/AgentSec-Inspector_1.4.0_x64-setup.exe
          cp "$appimage" release/assets/AgentSec-Inspector_1.4.0_amd64.AppImage
          cp "$deb" release/assets/AgentSec-Inspector_1.4.0_amd64.deb
          (
            cd release/assets
            sha256sum AgentSec-Inspector_* > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          test "$(find release/assets -maxdepth 1 -type f | wc -l)" -eq 5
          ls -lh release/assets

      - name: Create immutable tag and publish release
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "AgentSec Inspector $RELEASE_TAG" "$current"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag \
            --title "AgentSec Inspector $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES_1.4.0.md \
            release/assets/*
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,url,assets \
            --jq '{tag: .tagName,url: .url,assets: [.assets[].name]}'
