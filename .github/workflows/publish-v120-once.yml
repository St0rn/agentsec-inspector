# One-time dispatcher for the validated AgentSec Inspector v1.2.0 release.
# The existing release.yml still checks successful tagged Windows/Linux runs,
# downloads their verified artifacts, and creates the GitHub release.
name: Publish AgentSec v1.2.0 (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v120-once.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch-existing-release-workflow:
    if: github.repository == 'St0rn/agentsec-inspector'
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch validated v1.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --field tag=v1.2.0
