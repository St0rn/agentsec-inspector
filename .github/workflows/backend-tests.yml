name: Backend tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m ruff check agentsec tests ../demo
        working-directory: backend
      - run: python -m pytest --cov=agentsec --cov-report=xml --cov-report=term-missing
        working-directory: backend
        env: {AGENTSEC_DATA_DIR: "${{ runner.temp }}/agentsec-tests", AGENTSEC_API_TOKEN: ci-test-token}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-coverage, path: backend/coverage.xml}
