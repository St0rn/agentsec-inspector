name: Capture real AgentSec 1.5.0 screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-screenshots.yml
      - scripts/ci/capture-screenshots.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      AGENTSEC_API_TOKEN: agentsec-public-demo-token-not-for-production
      AGENTSEC_DATA_DIR: /tmp/agentsec-screenshot-lab
      AGENTSEC_PORT: "8765"
      VITE_API_TOKEN: agentsec-public-demo-token-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend, frontend and headless browser
        run: |
          python -m pip install -r backend/requirements.lock 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci
      - name: Start isolated real AgentSec backend and test servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AGENTSEC_DATA_DIR"
          python -m uvicorn agentsec.main:app --app-dir backend --host 127.0.0.1 --port 8765 > /tmp/agentsec-api.log 2>&1 &
          python -m uvicorn demo.server:app --host 127.0.0.1 --port 8877 > /tmp/agentsec-lab.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/agentsec-vite.log 2>&1 &
      - name: Capture actual app screens using laboratory data
        run: python scripts/ci/capture-screenshots.py
      - name: Verify generated screenshots (no automated Git commits)
        shell: bash
        run: |
          set -euo pipefail
          for file in dashboard dashboard-en language-selector manual-project manual-target mcp-passive mcp-active mcp-results mcp-inventory mcp-tool-form mcp-vulnerability-scan prompt-injection jailbreak rag-security rag-active-results controlled-lab black-box-request-preview adaptive-red-team adaptive-red-team-fr agent-behavior attack-chains scenario-packs findings reports report-preview-v1.5 report-cover report-finding report-payload; do
            test -s "docs/images/${file}.png"
          done
          echo "Screenshots generated; inspect/download the workflow artifact before adding images via normal maintainer commits."
      - name: Upload screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentsec-1.5.0-screenshots
          path: |
            docs/images/dashboard.png
            docs/images/dashboard-en.png
            docs/images/language-selector.png
            docs/images/manual-project.png
            docs/images/manual-target.png
            docs/images/mcp-passive.png
            docs/images/mcp-active.png
            docs/images/mcp-results.png
            docs/images/mcp-inventory.png
            docs/images/mcp-tool-form.png
            docs/images/mcp-vulnerability-scan.png
            docs/images/prompt-injection.png
            docs/images/jailbreak.png
            docs/images/rag-security.png
            docs/images/rag-active-results.png
            docs/images/black-box-request-preview.png
            docs/images/controlled-lab.png
            docs/images/adaptive-red-team.png
            docs/images/adaptive-red-team-fr.png
            docs/images/agent-behavior.png
            docs/images/attack-chains.png
            docs/images/scenario-packs.png
            docs/images/findings.png
            docs/images/reports.png
            docs/images/report-preview-v1.5.png
            docs/images/report-cover.png
            docs/images/report-finding.png
            docs/images/report-payload.png
      - name: Print logs if failed
        if: failure()
        shell: bash
        run: |
          for file in /tmp/agentsec-api.log /tmp/agentsec-lab.log /tmp/agentsec-vite.log; do
            echo "=== $file ==="
            tail -80 "$file" 2>/dev/null || true
          done
