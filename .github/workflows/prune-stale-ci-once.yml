name: One-time cancellation of stale main CI runs

on:
  push:
    paths:
      - .github/workflows/prune-stale-ci-once.yml

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT_SHA: ${{ github.sha }}
    steps:
      - name: Cancel only superseded validation jobs on main
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs?branch=main&per_page=100" |
            jq -r --arg sha "$CURRENT_SHA" '.workflow_runs[]
              | select(.head_sha != $sha)
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting")
              | select(.name == "Backend tests"
                  or .name == "Frontend tests"
                  or .name == "Security checks"
                  or .name == "Windows x64 build and installer validation"
                  or .name == "Linux x64 build and installation smoke test"
                  or .name == "Capture real AgentSec 1.4.0 screenshots")
              | .id' | while read -r id; do
                if [ -n "$id" ]; then
                  gh run cancel "$id" --repo "$GH_REPO" || true
                  echo "Cancelled superseded run $id"
                fi
              done
